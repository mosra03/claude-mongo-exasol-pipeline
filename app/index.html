<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2025 SO Survey · AI Pipeline Analysis</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #16213e;
      border-bottom: 2px solid #e94560;
      padding: 18px 32px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.01em;
    }
    header h1 em { color: #e94560; font-style: normal; }
    header p {
      margin-top: 5px;
      font-size: 0.76rem;
      color: #64748b;
    }

    /* ── Tabs ── */
    nav {
      background: #16213e;
      border-bottom: 1px solid #1e293b;
      padding: 0 24px;
      display: flex;
      overflow-x: auto;
      flex-shrink: 0;
    }
    nav::-webkit-scrollbar { height: 3px; }
    nav::-webkit-scrollbar-track { background: #1a1a2e; }
    nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    nav button {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #64748b;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
      font-family: inherit;
      line-height: 1.4;
    }
    nav button:hover { color: #cbd5e1; }
    nav button.active { color: #e94560; border-bottom-color: #e94560; }

    /* ── Main ── */
    main { flex: 1; padding: 24px 32px; }

    .panel { display: none; }
    .panel.active { display: block; }

    .chart-container {
      width: 100%;
      height: 520px;
      background: #16213e;
      border: 1px solid #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    .insight-box {
      margin-top: 14px;
      padding: 13px 18px;
      background: #16213e;
      border-left: 3px solid #e94560;
      border-radius: 0 6px 6px 0;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.7;
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 420px;
      color: #475569;
      font-size: 14px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1e293b;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 14px 32px;
      border-top: 1px solid #1e293b;
      color: #475569;
      font-size: 11.5px;
    }
    footer span { color: #e94560; }
  </style>
</head>
<body>

<header>
  <h1>2025 Stack Overflow Developer Survey · <em>AI Pipeline Analysis</em></h1>
  <p>49,191 respondents · Aggregated and visualised by a 4-agent Claude Code pipeline</p>
</header>

<nav id="tabs"></nav>

<main>
  <div id="loading">
    <div class="spinner"></div>
    <span>Loading charts…</span>
  </div>
  <div id="panels"></div>
</main>

<footer>
  Powered by <span>Claude Code</span> · MongoDB Atlas · Exasol SaaS · Apache ECharts
</footer>

<script>
  const WORLD_MAP_CDN =
    'https://cdn.jsdelivr.net/gh/apache/echarts-website@asf-site/examples/data/asset/geo/world.json';

  const chartInstances = [];

  async function main() {
    const [worldGeo, charts] = await Promise.all([
      fetch(WORLD_MAP_CDN).then(r => r.json()).catch(() => null),
      fetch('/api/data').then(r => r.json()),
    ]);

    if (worldGeo) echarts.registerMap('world', worldGeo);

    document.getElementById('loading').style.display = 'none';
    buildUI(charts);
  }

  function buildUI(charts) {
    const tabsEl   = document.getElementById('tabs');
    const panelsEl = document.getElementById('panels');

    charts.forEach((chart, i) => {
      /* Tab */
      const label = chart.question.length > 44
        ? chart.question.slice(0, 44).trimEnd() + '…'
        : chart.question;
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.title = chart.question;
      if (i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => switchTab(i));
      tabsEl.appendChild(btn);

      /* Panel */
      const panel = document.createElement('div');
      panel.className = 'panel' + (i === 0 ? ' active' : '');
      panel.id = `panel-${i}`;

      const wrap = document.createElement('div');
      wrap.className = 'chart-container';
      wrap.id = `chart-${i}`;
      panel.appendChild(wrap);

      if (chart.insight) {
        const box = document.createElement('div');
        box.className = 'insight-box';
        box.textContent = chart.insight;
        panel.appendChild(box);
      }

      panelsEl.appendChild(panel);

      /* ECharts */
      const instance = echarts.init(wrap, null, { renderer: 'canvas' });
      instance.setOption(chart.echarts_option);
      chartInstances.push(instance);
    });

    window.addEventListener('resize', () => chartInstances.forEach(c => c.resize()));
  }

  function switchTab(idx) {
    document.querySelectorAll('#tabs button').forEach((b, i) =>
      b.classList.toggle('active', i === idx));
    document.querySelectorAll('#panels .panel').forEach((p, i) =>
      p.classList.toggle('active', i === idx));
    requestAnimationFrame(() => chartInstances[idx]?.resize());
  }

  main().catch(err => {
    document.getElementById('loading').innerHTML =
      `<div style="color:#e94560;font-size:14px">Error: ${err.message}</div>`;
  });
</script>

</body>
</html>
